name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit and CLI tests
        working-directory: plugins/systm-builds
        run: npm test
      - name: References in sync
        working-directory: plugins/systm-builds
        run: node scripts/sync-references.mjs --check
      - name: Sample reproduces
        working-directory: plugins/systm-builds
        run: node scripts/systm.mjs selftest
